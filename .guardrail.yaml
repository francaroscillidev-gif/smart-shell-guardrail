# Configurazione avanzata per Guardrail CLI Enterprise
strict_mode: false
timeout_seconds: 30
max_output_kb: 512

# Whitelist facoltativa (se vuota, tutti i comandi non-bloccati sono permessi)
allowed_commands_whitelist: []

# Pattern regex personalizzati da bloccare
custom_blocked_patterns:
  - "(?i)npm\\s+publish" # previene release accidentali su npm

network:
  # Se true, blocca connessioni esterne eccetto quelle in allowed_domains
  block_external_egress: false
  allowed_domains:
    - "github.com"
    - "api.github.com"
    - "pypi.org"
    - "files.pythonhosted.org"
    - "registry.npmjs.org"
    - "crates.io"

audit:
  enabled: true
  log_file: "~/.guardrail/audit.jsonl"
