[project]
name = "guardrail-cli"
version = "0.1.0"
description = "Smart CLI / Shell Agent Guardrail and Copilot"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "franca roscilli", email = "francaroscillidev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "gitpython>=3.2.1",
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "toml>=0.10.2",
]

[project.scripts]
guardrail-cli = "guardrail_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
